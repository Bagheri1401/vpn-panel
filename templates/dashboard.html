<!DOCTYPE html>
<html>
<head><title>VPN Panel</title></head>
<body>
<h1>کاربران VPN</h1>
<a href="/create/">افزودن کاربر</a>
<table border="1">
<tr><th>نام کاربری</th><th>پروتکل</th><th>سرور</th><th>انقضا</th><th>مصرف</th></tr>
{% for user in users %}
<tr>
<td>{{ user.username }}</td><td>{{ user.protocol }}</td><td>{{ user.server.name }}</td><td>{{ user.expire_at }}</td><td>{{ user.traffic_used_mb }} MB</td>
</tr>
{% endfor %}
</table>
</body>
</html>
